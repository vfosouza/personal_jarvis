services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - qdrant

  indexer:
    build: ./indexer
    depends_on:
      - qdrant
    volumes:
      - /Users/vfosouza/Workspace:/repositories/Workspace
      - /Users/vfosouza/Workspace_Servier:/repositories/Workspace_Servier